name: Tests

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InterviewIQ/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: InterviewIQ/backend/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: InterviewIQ/backend/coverage

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InterviewIQ/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: InterviewIQ/ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: InterviewIQ/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: InterviewIQ/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: InterviewIQ/frontend/test-results

  docker-smoke-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: curl smoke test
        run: bash InterviewIQ/backend/tests/smoke.sh
      - uses: grafana/setup-k6-action@v1
      - name: k6 load test
        run: k6 run InterviewIQ/backend/tests/k6/load.js
      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api